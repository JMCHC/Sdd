<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solidaridad Apoya</title>
    <style>
        /* VARIABLES Y RESET */
        :root {
            --bg-blue: #64849A;
            --folder-red: #C33C3A;
            --text-light: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body {
            background-color: var(--bg-blue);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
        }

        /* PANTALLA DE INICIO DE SESIÓN */
        .auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-blue);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; transition: opacity 0.5s ease;
            overflow-y: auto;
        }
        .auth-modal {
            width: 100%; max-width: 400px; padding: 20px 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: flex; flex-direction: column;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            margin: auto;
        }
        .auth-logo { 
            width: 360px; 
            margin: -60px auto -50px auto;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); 
        }
        .auth-modal h2 { text-align: center; margin-bottom: 2px; font-weight: 500;}
        .auth-modal p { text-align: center; margin-bottom: 15px; font-size: 0.9em; opacity: 0.8; }
        .input-field {
            width: 100%; padding: 12px; margin-bottom: 10px;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px; color: white; outline: none; transition: 0.3s;
        }
        .input-field::placeholder { color: rgba(255,255,255,0.6); }
        .input-field:focus { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.5); }
        .auth-buttons { display: flex; gap: 10px; margin-top: 5px; }
        .btn-primary, .btn-secondary {
            flex: 1; padding: 12px; border-radius: 12px; border: none;
            font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary { background: var(--folder-red); color: white; box-shadow: inset 0 2px 4px rgba(255,255,255,0.2), 0 4px 10px rgba(0,0,0,0.2); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
        .btn-primary:hover, .btn-secondary:hover { transform: translateY(-2px); }

        /* INTERFAZ PRINCIPAL */
        .dashboard {
            width: 100%; max-width: 1000px; padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        
        .main-logo { 
            width: 480px; 
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.15;
            pointer-events: none;
        }
        
        .search-container { width: 100%; max-width: 600px; margin-bottom: 40px; }
        .search-bar {
            width: 100%; padding: 16px 24px; border-radius: 30px;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; font-size: 1.1em; backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1); transition: 0.3s;
        }
        .search-bar::placeholder { color: rgba(255,255,255,0.7); }
        .search-bar:focus { background: rgba(255,255,255,0.15); outline: none; border-color: rgba(255,255,255,0.4); }

        /* CARPETAS ROJAS PREMIUM */
        .folders-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px; width: 100%;
        }
        .folder {
            background-color: var(--folder-red);
            border-radius: 16px; padding: 30px 20px;
            cursor: pointer; text-align: center; font-weight: 600; font-size: 1.2em;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2), inset 0 2px 5px rgba(255,255,255,0.3);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.1);
            word-wrap: break-word; 
        }
        .folder:hover { transform: translateY(-8px); }
        .header-title { margin-bottom: 20px; font-weight: 300; letter-spacing: 1px; width: 100%; }

        /* ITEM NOTA */
        .nota-item {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px; padding: 20px;
            display: flex; flex-direction: column; gap: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }
        .nota-header {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 1.2em; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;
        }
        .nota-details {
            display: flex; justify-content: space-between; font-size: 1.1em;
        }
        .promedio-box {
            background: rgba(255,255,255,0.1); padding: 15px 30px; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.2); margin-bottom: 30px;
            font-size: 1.3em; font-weight: 500; backdrop-filter: blur(10px);
            text-align: center;
        }
        
        /* MENÚ DE USUARIO (HAMBURGUESA) */
        .user-menu-container {
            position: absolute; top: 20px; right: 20px; z-index: 100;
        }
        .hamburger-btn {
            background: transparent; border: 1px solid rgba(255,255,255,0.3);
            padding: 10px; border-radius: 12px; cursor: pointer;
            display: flex; flex-direction: column; gap: 5px;
            transition: background 0.2s;
        }
        .hamburger-btn:hover { background: rgba(255,255,255,0.1); }
        .hamburger-btn span {
            display: block; width: 22px; height: 2px;
            background-color: white; border-radius: 2px;
        }
        .dropdown-menu {
            position: absolute; top: 100%; right: 0; margin-top: 10px;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: none; flex-direction: column; overflow: hidden;
            min-width: 160px;
        }
        .dropdown-menu.show { display: flex; }
        .dropdown-item {
            background: transparent; border: none; color: white;
            padding: 14px 20px; text-align: left; cursor: pointer;
            font-size: 1em; font-weight: 500; transition: background 0.2s;
        }
        .dropdown-item:hover { background: rgba(255,255,255,0.2); }
        .dropdown-item:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <!-- OVERLAY DE INICIO DE SESIÓN -->
    <div id="auth-overlay" class="auth-overlay">
        <div class="auth-modal">
            <img src="https://lh3.googleusercontent.com/pw/AP1GczM-QDLV4_StoQYFE9fpmfm2AjaXbodPfWn5iZcmR0C3W_yrnM1P69rQ-UL97rllE-OVF4Zz7ZrhxT6AhbLpVzR1-MURUIj9RTF7UXoXZwv2oNBoV8ULKilizJBb27YYpWLeDTZTQk0sP44b1wyfxFz3KQ=w599-h599-s-no-gm?authuser=0" alt="Logo" class="auth-logo">
            <h2>Acceso Académico</h2>
            <p>Ingresa con tu correo institucional UC</p>
            
            <input type="email" id="auth-email" placeholder="usuario@uc.cl" class="input-field">
            <input type="password" id="auth-password" placeholder="Contraseña" class="input-field">
            
            <div id="auth-error" style="display: none; color: #ffcccc; margin-bottom: 15px; font-size: 0.9em; text-align: center;"></div>
            
            <div class="auth-buttons">
                <button id="btn-login" class="btn-primary">Ingresar</button>
                <button id="btn-register" class="btn-secondary">Registrarse</button>
            </div>
        </div>
    </div>

    <!-- OVERLAYS PARA REPOSITORIO ORIGINAL -->
    <div id="input-overlay" class="auth-overlay" style="display: none; z-index: 1001;">
        <div class="auth-modal">
            <h2 id="input-title">Nuevo Ramo</h2>
            <input type="text" id="input-value" class="input-field" placeholder="Nombre del Ramo...">
            <div class="auth-buttons">
                <button id="btn-input-cancel" class="btn-secondary">Cancelar</button>
                <button id="btn-input-save" class="btn-primary">Guardar</button>
            </div>
        </div>

    <!-- OVERLAYS PARA MIS NOTAS -->
    <div id="overlay-mi-ramo" class="auth-overlay" style="display: none; z-index: 1001;">
        <div class="auth-modal">
            <h2>Nuevo Ramo Personal</h2>
            <input type="text" id="input-mi-ramo" class="input-field" placeholder="Ej. Cálculo I">
            <div class="auth-buttons">

                <button id="btn-save-mi-ramo" class="btn-primary">Guardar</button>

    <div id="overlay-mi-nota" class="auth-overlay" style="display: none; z-index: 1001;">
        <div class="auth-modal">
            <h2 id="modal-nota-title">Agregar Evaluación</h2>
            <input type="text" id="input-nota-nombre" class="input-field" placeholder="Nombre (ej. I1)">
            <input type="number" id="input-nota-porcentaje" class="input-field" placeholder="Porcentaje (ej. 25) %" min="0" max="100">
            <input type="number" id="input-nota-valor" class="input-field" placeholder="Nota (ej. 6.5)" step="0.1" min="1" max="7">
            <div class="auth-buttons">
                <button id="btn-cancel-mi-nota" class="btn-secondary">Cancelar</button>
                <button id="btn-save-mi-nota" class="btn-primary">Guardar</button>
            </div>
        </div>
    </div>

    <!-- INPUT INVISIBLE PARA SUBIR PDF -->
    <input type="file" id="file-upload" accept="application/pdf" style="display: none;">

    <!-- INTERFAZ PRINCIPAL -->
    <!-- MENÚ DE USUARIO DESPLEGABLE -->
    <div id="user-menu-container" class="user-menu-container" style="display: none;">
        <button id="btn-menu" class="hamburger-btn">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div id="dropdown-menu" class="dropdown-menu">
            <button id="btn-inicio" class="dropdown-item">Inicio</button>
            <button id="btn-mis-notas" class="dropdown-item">Mis notas</button>
            <button id="btn-logout" class="dropdown-item">Cerrar sesión</button>
        </div>
    </div>
    
    <div class="dashboard" id="dashboard" style="display: none;">
        <img src="https://lh3.googleusercontent.com/pw/AP1GczM-QDLV4_StoQYFE9fpmfm2AjaXbodPfWn5iZcmR0C3W_yrnM1P69rQ-UL97rllE-OVF4Zz7ZrhxT6AhbLpVzR1-MURUIj9RTF7UXoXZwv2oNBoV8ULKilizJBb27YYpWLeDTZTQk0sP44b1wyfxFz3KQ=w599-h599-s-no-gm?authuser=0" alt="Logo SddApoya" class="main-logo">
        
        <div class="search-container" id="search-container">
            <input type="text" id="search-bar" class="search-bar" placeholder="Buscar carreras, ramos, archivos...">
        </div>

        <!-- NIVEL 1: CARRERAS -->
        <div id="view-carreras" style="width: 100%;">
            <h2 class="header-title">Carreras</h2>
            <div class="folders-grid" id="carreras-grid"></div>
        </div>

        <!-- NIVEL 2: RAMOS -->
        <div id="view-ramos" style="width: 100%; display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; width: 100%;">
                <button id="btn-back-carreras" class="btn-secondary" style="flex: 0 1 auto; padding: 8px 16px; margin: 0;">⬅ Volver a Carreras</button>
                <h2 class="header-title" id="title-carrera" style="margin-bottom: 0; text-align: right; font-weight: 500;">Ramos</h2>
            </div>
            <div class="folders-grid" id="ramos-grid"></div>
        </div>

        <!-- NIVEL 3: ARCHIVOS (PDFs) -->
        <div id="view-archivos" style="width: 100%; display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; width: 100%;">
                <button id="btn-back-ramos" class="btn-secondary" style="flex: 0 1 auto; padding: 8px 16px; margin: 0;">⬅ Volver a Ramos</button>
                <h2 class="header-title" id="title-ramo" style="margin-bottom: 0; text-align: right; font-weight: 500;">Archivos</h2>
            </div>
            <div id="upload-status" style="width: 100%; text-align: center; color: #a8e6cf; margin-bottom: 15px; display: none;">Convirtiendo y subiendo archivo... (Puede tomar unos segundos)</div>
            <div class="folders-grid" id="archivos-grid"></div>
        </div>

        <!-- SECCIÓN MIS NOTAS: RAMOS PERSONALES -->
        <div id="view-mis-notas" style="width: 100%; display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; width: 100%;">
                <h2 class="header-title" style="margin-bottom: 0; font-weight: 500;">Ramos Personales</h2>
            </div>
            <div class="folders-grid" id="mis-ramos-grid"></div>
        </div>

        <!-- SECCIÓN MIS NOTAS: DETALLE EVALUACIONES -->
        <div id="view-detalle-notas" style="width: 100%; display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; width: 100%;">
                <button id="btn-back-mis-notas" class="btn-secondary" style="flex: 0 1 auto; padding: 8px 16px; margin: 0;">⬅ Volver a Ramos</button>
                <h2 class="header-title" id="title-mi-ramo" style="margin-bottom: 0; text-align: right; font-weight: 500;">Ramo</h2>
            </div>
            
            <div style="display: flex; justify-content: center; width: 100%;">
                <div class="promedio-box" id="promedio-box-container">
                    <!-- Contenido insertado por JS -->
                </div>
            </div>

            <div class="folders-grid" id="mis-notas-grid"></div>
        </div>

    </div>

    <!-- LÓGICA DE FIREBASE AUTH Y CLOUDFLARE D1 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // URL del backend seguro en Cloudflare
        const WORKER_URL = "https://sdd-backend.christensenjosemanuel.workers.dev";

        const firebaseConfig = {
            apiKey: "AIzaSyCwE3pxEaU1hqxUW1zeokgzkNPBGYSvIOg",
            authDomain: "basedatos-universidad.firebaseapp.com",
            projectId: "basedatos-universidad",
            storageBucket: "basedatos-universidad.firebasestorage.app",
            messagingSenderId: "997345827243",
            appId: "1:997345827243:web:1d30c25373cd2bc5511aee"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // DOM Elements
        const overlay = document.getElementById('auth-overlay');
        const dashboard = document.getElementById('dashboard');
        const emailInput = document.getElementById('auth-email');
        const passwordInput = document.getElementById('auth-password');
        const errorMsg = document.getElementById('auth-error');
        
        // Menú Desplegable
        const userMenuContainer = document.getElementById('user-menu-container');
        const btnMenu = document.getElementById('btn-menu');
        const dropdownMenu = document.getElementById('dropdown-menu');
        const btnInicio = document.getElementById('btn-inicio');
        const btnMisNotasUI = document.getElementById('btn-mis-notas');
        const btnLogoutUI = document.getElementById('btn-logout');
        
        const searchContainer = document.getElementById('search-container');
        const searchBar = document.getElementById('search-bar');
        
        // Vistas
        const viewCarreras = document.getElementById('view-carreras');
        const viewRamos = document.getElementById('view-ramos');
        const viewArchivos = document.getElementById('view-archivos');
        const viewMisNotas = document.getElementById('view-mis-notas');
        const viewDetalleNotas = document.getElementById('view-detalle-notas');
        
        // Grids
        const carrerasGrid = document.getElementById('carreras-grid');
        const ramosGrid = document.getElementById('ramos-grid');
        const archivosGrid = document.getElementById('archivos-grid');
        const misRamosGrid = document.getElementById('mis-ramos-grid');
        const misNotasGrid = document.getElementById('mis-notas-grid');
        
        const titleCarrera = document.getElementById('title-carrera');
        const titleRamo = document.getElementById('title-ramo');
        const titleMiRamo = document.getElementById('title-mi-ramo');
        const promedioBoxContainer = document.getElementById('promedio-box-container');
        
        const btnBackCarreras = document.getElementById('btn-back-carreras');
        const btnBackRamos = document.getElementById('btn-back-ramos');
        const btnBackMisNotas = document.getElementById('btn-back-mis-notas');

        // Overlays
        const inputOverlay = document.getElementById('input-overlay');
        const inputValue = document.getElementById('input-value');
        const btnInputSave = document.getElementById('btn-input-save');
        const btnInputCancel = document.getElementById('btn-input-cancel');
        
        const overlayMiRamo = document.getElementById('overlay-mi-ramo');
        const inputMiRamo = document.getElementById('input-mi-ramo');
        const btnSaveMiRamo = document.getElementById('btn-save-mi-ramo');
        const btnCancelMiRamo = document.getElementById('btn-cancel-mi-ramo');

        const overlayMiNota = document.getElementById('overlay-mi-nota');
        const modalNotaTitle = document.getElementById('modal-nota-title');
        const inputNotaNombre = document.getElementById('input-nota-nombre');
        const inputNotaPorcentaje = document.getElementById('input-nota-porcentaje');
        const inputNotaValor = document.getElementById('input-nota-valor');
        const btnSaveMiNota = document.getElementById('btn-save-mi-nota');
        const btnCancelMiNota = document.getElementById('btn-cancel-mi-nota');

        const fileUpload = document.getElementById('file-upload');
        const uploadStatus = document.getElementById('upload-status');

        let currentCarrera = null;
        let currentRamoId = null;
        let currentRamoNombre = null;
        
        // Variables para Mis Notas
        let currentMiRamoId = null;
        let currentMiRamoNombre = null;
        let isAddingExam = false; // Controla si guardamos una nota normal o el examen Método 1

        // --- LÓGICA DEL MENÚ DESPLEGABLE ---
        btnMenu.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle('show');
        });

        document.addEventListener('click', (e) => {
            if (!userMenuContainer.contains(e.target)) {
                dropdownMenu.classList.remove('show');
            }
        });

        // NAVEGACIÓN PRINCIPAL
        function hideAllViews() {
            viewCarreras.style.display = 'none';
            viewRamos.style.display = 'none';
            viewArchivos.style.display = 'none';
            viewMisNotas.style.display = 'none';
            viewDetalleNotas.style.display = 'none';
        }

        btnInicio.addEventListener('click', () => {
            dropdownMenu.classList.remove('show');
            hideAllViews();
            searchContainer.style.display = 'block';
            viewCarreras.style.display = 'block';
            searchBar.value = '';
            carrerasGrid.querySelectorAll('.folder').forEach(item => item.style.display = 'block');
        });

        btnMisNotasUI.addEventListener('click', () => {
            dropdownMenu.classList.remove('show');
            hideAllViews();
            searchContainer.style.display = 'none';
            viewMisNotas.style.display = 'block';
            loadMisRamos();
        });

        const carrerasFijas = [
            "Actuación", "Administración Pública", "Agronomía", "Antropología", "Arqueología",
            "Arquitectura", "Arte", "Astronomía", "Bachillerato Inicia en Ciencias Naturales y Matemática",
            "Bachillerato Inicia en Ciencias Sociales", "Biología", "Biología Marina", "Bioquímica", "Ciencia Política", 
            "College Artes y Humanidades", "College Ciencias Naturales y Matemáticas", "College Ciencias Sociales",
            "Construcción Civil", "Derecho", "Dirección Audiovisual", "Diseño", "Enfermería", "Estadística", "Estética",
            "Filosofía", "Física", "Fonoaudiología", "Geografía", "Historia", "Ingeniería", "Ingeniería Comercial",
            "Ingeniería en Recursos Naturales", "Ingeniería Forestal", "Interpretación Musical", "Kinesiología",
            "Letras Hispánicas", "Letras Inglesas", "Licenciatura en Ingeniería en Ciencia de Datos",
            "Licenciatura en Ingeniería en Ciencia de la Computación", "Matemática", "Medicina", "Medicina Veterinaria",
            "Música", "Nutrición y Dietética", "Odontología", "Pedagogías", "Periodismo", "Planificación Urbana", 
            "Psicología", "Publicidad", "Química", "Química y Farmacia", "Sociología", "Teología", "Terapia Ocupacional", "Trabajo Social"
        ];

        // --- BUSCADOR ---
        searchBar.addEventListener('input', (e) => {
            const text = e.target.value.toLowerCase();
            let activeGrid = viewCarreras.style.display !== 'none' ? carrerasGrid : 
                            (viewRamos.style.display !== 'none' ? ramosGrid : archivosGrid);

            activeGrid.querySelectorAll('.folder').forEach(item => {
                const name = item.textContent.toLowerCase();
                item.style.display = name.includes(text) ? 'block' : 'none';
            });
        });

        // --- NIVEL 1: CARRERAS ---
        function loadCarreras() {
            carrerasGrid.innerHTML = '';
            carrerasFijas.forEach((carrera) => {
                const div = document.createElement('div');
                div.className = 'folder';
                div.textContent = carrera;
                div.onclick = () => openCarrera(carrera);
                carrerasGrid.appendChild(div);
            });
        }

        // --- NIVEL 2: RAMOS CON D1 SQLITE ---
        async function openCarrera(nombreCarrera) {
            currentCarrera = nombreCarrera;
            titleCarrera.textContent = nombreCarrera;
            hideAllViews();
            viewRamos.style.display = 'block';
            searchBar.value = '';

            ramosGrid.innerHTML = '<p style="text-align:center; width:100%; opacity:0.7;">Cargando ramos...</p>';
            
            try {
                const res = await fetch(`${WORKER_URL}/ramos?carrera=${encodeURIComponent(nombreCarrera)}`);
                const ramosData = await res.json();
                ramosGrid.innerHTML = '';

                ramosData.forEach((ramo) => {
                    const div = document.createElement('div');
                    div.className = 'folder';
                    div.textContent = ramo.nombre;
                    div.onclick = () => openRamo(ramo.id, ramo.nombre);
                    ramosGrid.appendChild(div);
                });
            } catch(e) { ramosGrid.innerHTML = '<p style="text-align:center; width:100%;">Error al conectar con la base de datos.</p>'; }

            const btnAdd = document.createElement('div');
            btnAdd.className = 'folder';
            btnAdd.style.backgroundColor = 'rgba(255,255,255,0.05)';
            btnAdd.style.border = '1px dashed rgba(255,255,255,0.4)';
            btnAdd.style.boxShadow = 'none';
            btnAdd.textContent = '+ Agregar Ramo';
            btnAdd.onclick = () => {
                inputValue.value = '';
                inputOverlay.style.display = 'flex';
                setTimeout(() => inputOverlay.style.opacity = '1', 50);
                inputValue.focus();
            };
            ramosGrid.appendChild(btnAdd);
        }

        btnBackCarreras.onclick = () => {
            hideAllViews();
            viewCarreras.style.display = 'block';
            currentCarrera = null;
            searchBar.value = '';
            carrerasGrid.querySelectorAll('.folder').forEach(item => item.style.display = 'block');
        };

        btnInputSave.onclick = async () => {
            const val = inputValue.value.trim();
            if (!val) return;
            btnInputSave.disabled = true;
            btnInputSave.textContent = 'Guardando...';

            try {
                await fetch(`${WORKER_URL}/ramos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nombre: val,
                        carrera: currentCarrera,
                        creadoPor: auth.currentUser.email
                    })
                });
                btnInputCancel.click();
                await openCarrera(currentCarrera);
            } catch (e) {
                alert('Error de conexión con Cloudflare D1.');
            }
            btnInputSave.disabled = false;
            btnInputSave.textContent = 'Guardar';
        };

        btnInputCancel.onclick = () => {
            inputOverlay.style.opacity = '0';
            setTimeout(() => inputOverlay.style.display = 'none', 500);
        };

        // --- NIVEL 3: ARCHIVOS CON D1 BASE64 ---
        async function openRamo(ramoId, ramoNombre) {
            currentRamoId = ramoId;
            currentRamoNombre = ramoNombre;
            titleRamo.textContent = ramoNombre;
            hideAllViews();
            viewArchivos.style.display = 'block';
            searchBar.value = '';

            archivosGrid.innerHTML = '<p style="text-align:center; width:100%; opacity:0.7;">Cargando archivos...</p>';
            
            try {
                const res = await fetch(`${WORKER_URL}/archivos?ramoId=${ramoId}`);
                const archivosData = await res.json();
                archivosGrid.innerHTML = '';

                archivosData.forEach((archivo) => {
                    const div = document.createElement('div');
                    div.className = 'folder';
                    div.innerHTML = `📄 ${archivo.nombre}`;
                    
                    div.onclick = () => {
                        const win = window.open();
                        win.document.write(`<iframe src="${archivo.url}" frameborder="0" style="border:0; top:0px; left:0px; bottom:0px; right:0px; width:100%; height:100%;" allowfullscreen></iframe>`);
                    };
                    archivosGrid.appendChild(div);
                });
            } catch(e) { archivosGrid.innerHTML = '<p style="text-align:center; width:100%;">Error al conectar con la base de datos.</p>'; }

            const btnUpload = document.createElement('div');
            btnUpload.className = 'folder';
            btnUpload.style.backgroundColor = 'rgba(255,255,255,0.05)';
            btnUpload.style.border = '1px dashed rgba(255,255,255,0.4)';
            btnUpload.style.boxShadow = 'none';
            btnUpload.textContent = '+ Subir PDF';
            btnUpload.onclick = () => fileUpload.click();
            archivosGrid.appendChild(btnUpload);
        }

        btnBackRamos.onclick = () => openCarrera(currentCarrera);

        fileUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.type !== 'application/pdf') {
                alert('Solo se admiten archivos PDF.');
                fileUpload.value = '';
                return;
            }
            uploadStatus.style.display = 'block';
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const base64String = reader.result;
                try {
                    const response = await fetch(`${WORKER_URL}/archivos`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            nombre: file.name,
                            ramoId: currentRamoId,
                            base64: base64String,
                            subidoPor: auth.currentUser.email
                        })
                    });
                    if (!response.ok) throw new Error('Fallo la carga. Si el PDF tiene muchas páginas, intenta comprimirlo.');
                    await openRamo(currentRamoId, currentRamoNombre);
                } catch (error) { alert('Error: ' + error.message); }
                uploadStatus.style.display = 'none';
                fileUpload.value = ''; 
            };
            reader.onerror = () => {
                alert('Error al procesar el archivo en tu navegador.');
                uploadStatus.style.display = 'none';
            };
        });

        // -----------------------------------------
        // --- SECCIÓN MIS NOTAS / RAMOS PROPIOS ---
        // -----------------------------------------

        async function loadMisRamos() {
            misRamosGrid.innerHTML = '<p style="text-align:center; width:100%; opacity:0.7;">Cargando tus ramos...</p>';
            
            try {
                const res = await fetch(`${WORKER_URL}/mis-ramos?email=${encodeURIComponent(auth.currentUser.email)}`);
                const ramosData = await res.json();
                misRamosGrid.innerHTML = '';

                ramosData.forEach((ramo) => {
                    const div = document.createElement('div');
                    div.className = 'folder';
                    div.textContent = ramo.nombre;
                    div.onclick = () => openMiRamo(ramo.id, ramo.nombre);
                    misRamosGrid.appendChild(div);
                });
            } catch(e) { misRamosGrid.innerHTML = '<p style="text-align:center; width:100%;">No se pudo conectar a tu base de datos.</p>'; }

            const btnAdd = document.createElement('div');
            btnAdd.className = 'folder';
            btnAdd.style.backgroundColor = 'rgba(255,255,255,0.05)';
            btnAdd.style.border = '1px dashed rgba(255,255,255,0.4)';
            btnAdd.style.boxShadow = 'none';
            btnAdd.textContent = '+ Crear Ramo Personal';
            btnAdd.onclick = () => {
                inputMiRamo.value = '';
                overlayMiRamo.style.display = 'flex';
                setTimeout(() => overlayMiRamo.style.opacity = '1', 50);
                inputMiRamo.focus();
            };
            misRamosGrid.appendChild(btnAdd);
        }

        btnSaveMiRamo.onclick = async () => {
            const val = inputMiRamo.value.trim();
            if (!val) return;
            btnSaveMiRamo.disabled = true;
            btnSaveMiRamo.textContent = 'Guardando...';

            try {
                await fetch(`${WORKER_URL}/mis-ramos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nombre: val,
                        email: auth.currentUser.email
                    })
                });
                btnCancelMiRamo.click();
                await loadMisRamos();
            } catch (e) { alert('Error al guardar en tu base de datos.'); }
            
            btnSaveMiRamo.disabled = false;
            btnSaveMiRamo.textContent = 'Guardar';
        };

        btnCancelMiRamo.onclick = () => {
            overlayMiRamo.style.opacity = '0';
            setTimeout(() => overlayMiRamo.style.display = 'none', 500);
        };

        // --- DETALLE DE NOTAS Y LÓGICA DE EXAMEN (MÉTODO 1 Y 2) ---
        async function openMiRamo(ramoId, ramoNombre) {
            currentMiRamoId = ramoId;
            currentMiRamoNombre = ramoNombre;
            titleMiRamo.textContent = ramoNombre;
            hideAllViews();
            viewDetalleNotas.style.display = 'block';

            misNotasGrid.innerHTML = '<p style="text-align:center; width:100%; opacity:0.7;">Cargando tus notas...</p>';
            promedioBoxContainer.innerHTML = 'Calculando...';
            
            try {
                const res = await fetch(`${WORKER_URL}/mis-notas?ramoId=${ramoId}&email=${encodeURIComponent(auth.currentUser.email)}`);
                const notasData = await res.json();
                misNotasGrid.innerHTML = '';

                let sumaPonderada = 0;
                let porcentajeTotal = 0;
                
                let examenNota = null;
                let notasNormales = [];

                // Separamos si hay un Examen del Método 1 (Escondido bajo la etiqueta [EXAMEN])
                notasData.forEach((nota) => {
                    if (nota.nombre.startsWith('[EXAMEN]')) {
                        examenNota = nota;
                    } else {
                        notasNormales.push(nota);
                    }
                });

                // Renderizamos y calculamos el promedio de las Notas Normales
                notasNormales.forEach((nota) => {
                    const porc = parseFloat(nota.porcentaje) || 0;
                    const val = parseFloat(nota.valor) || 0;
                    
                    sumaPonderada += (val * (porc / 100));
                    porcentajeTotal += porc;

                    const div = document.createElement('div');
                    div.className = 'nota-item';
                    div.innerHTML = `
                        <div class="nota-header">
                            <span>${nota.nombre}</span>
                            <span>${nota.porcentaje}%</span>
                        </div>
                        <div class="nota-details">
                            <span style="opacity: 0.8;">Nota Obtenida:</span>
                            <span style="font-weight: bold; color: #a8e6cf;">${nota.valor}</span>
                        </div>
                    `;
                    misNotasGrid.appendChild(div);
                });

                // Calculamos el Promedio Base (O Nota de Presentación)
                let promedioBase = 0;
                if (porcentajeTotal > 0) {
                    promedioBase = sumaPonderada / (porcentajeTotal / 100);
                }

                // Generamos la Vista del Cuadro Principal de Promedio
                if (examenNota) {
                    // LÓGICA MÉTODO 1 (Nota de Presentación comprimida + Examen extra)
                    const pesoExamen = parseFloat(examenNota.porcentaje) || 0;
                    const pesoRestante = 100 - pesoExamen;
                    const valorExamen = parseFloat(examenNota.valor) || 0;
                    
                    const notaFinal = (promedioBase * (pesoRestante / 100)) + (valorExamen * (pesoExamen / 100));
                    
                    promedioBoxContainer.innerHTML = `
                        <div style="font-size: 0.85em; opacity: 0.8; margin-bottom: 5px;">Nota de Presentación (Vale ${pesoRestante}%): ${promedioBase > 0 ? promedioBase.toFixed(2) : '--'}</div>
                        <div style="color: #a8e6cf; font-weight: bold;">Promedio Final: ${notaFinal.toFixed(2)}</div>
                    `;

                    // Renderizar Tarjeta del Examen Destacada
                    const divExam = document.createElement('div');
                    divExam.className = 'nota-item';
                    divExam.style.borderColor = '#FFD700';
                    divExam.style.background = 'rgba(255, 215, 0, 0.05)';
                    divExam.innerHTML = `
                        <div class="nota-header" style="color: #FFD700;">
                            <span>⭐ ${examenNota.nombre.replace('[EXAMEN] ', '')}</span>
                            <span>${examenNota.porcentaje}%</span>
                        </div>
                        <div class="nota-details">
                            <span style="opacity: 0.8;">Nota Obtenida:</span>
                            <span style="font-weight: bold; color: #a8e6cf;">${examenNota.valor}</span>
                        </div>
                    `;
                    misNotasGrid.appendChild(divExam);
                } else {
                    // LÓGICA MÉTODO 2 (Solo se ven las notas ingresadas, si suman 100 es directo)
                    promedioBoxContainer.innerHTML = `
                        <div>Promedio Actual: <span style="color: #a8e6cf;">${promedioBase > 0 ? promedioBase.toFixed(2) : '--'}</span></div>
                        <div style="font-size: 0.7em; opacity: 0.7; font-weight: normal; margin-top: 5px;">(Basado en el ${porcentajeTotal}% evaluado)</div>
                    `;
                }

                // Botón Agregar Evaluación Normal
                const btnAddNota = document.createElement('div');
                btnAddNota.className = 'folder';
                btnAddNota.style.backgroundColor = 'rgba(255,255,255,0.05)';
                btnAddNota.style.border = '1px dashed rgba(255,255,255,0.4)';
                btnAddNota.style.boxShadow = 'none';
                btnAddNota.textContent = '+ Agregar Evaluación';
                btnAddNota.onclick = () => {
                    isAddingExam = false;
                    modalNotaTitle.textContent = 'Agregar Evaluación';
                    inputNotaNombre.value = '';
                    inputNotaNombre.disabled = false;
                    inputNotaPorcentaje.value = '';
                    inputNotaValor.value = '';
                    overlayMiNota.style.display = 'flex';
                    setTimeout(() => overlayMiNota.style.opacity = '1', 50);
                    inputNotaNombre.focus();
                };
                misNotasGrid.appendChild(btnAddNota);

                // Botón Agregar Examen (Método 1) - Solo si no hay un examen registrado
                if (!examenNota) {
                    const btnAddExamen = document.createElement('div');
                    btnAddExamen.className = 'folder';
                    btnAddExamen.style.backgroundColor = 'rgba(255, 215, 0, 0.05)';
                    btnAddExamen.style.border = '1px dashed #FFD700';
                    btnAddExamen.style.boxShadow = 'none';
                    btnAddExamen.style.color = '#FFD700';
                    btnAddExamen.textContent = '⭐ Agregar Examen';
                    btnAddExamen.onclick = () => {
                        isAddingExam = true;
                        modalNotaTitle.textContent = 'Agregar Examen Final';
                        inputNotaNombre.value = 'Examen Final';
                        inputNotaPorcentaje.value = '';
                        inputNotaValor.value = '';
                        overlayMiNota.style.display = 'flex';
                        setTimeout(() => overlayMiNota.style.opacity = '1', 50);
                        inputNotaPorcentaje.focus();
                    };
                    misNotasGrid.appendChild(btnAddExamen);
                }

            } catch(e) { misNotasGrid.innerHTML = '<p style="text-align:center; width:100%;">No se pudo cargar la información.</p>'; }
        }

        btnBackMisNotas.onclick = () => {
            hideAllViews();
            viewMisNotas.style.display = 'block';
            currentMiRamoId = null;
        };

        btnSaveMiNota.onclick = async () => {
            let nombre = inputNotaNombre.value.trim();
            const porcentaje = inputNotaPorcentaje.value.trim();
            const valor = inputNotaValor.value.trim();
            
            if (!nombre || !porcentaje || !valor) {
                alert("Por favor completa todos los campos.");
                return;
            }

            // Si es un examen especial Método 1, le agregamos la etiqueta oculta
            if (isAddingExam) {
                nombre = '[EXAMEN] ' + nombre;
            }

            btnSaveMiNota.disabled = true;
            btnSaveMiNota.textContent = 'Guardando...';

            try {
                await fetch(`${WORKER_URL}/mis-notas`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ramoId: currentMiRamoId,
                        email: auth.currentUser.email,
                        nombre: nombre,
                        porcentaje: parseFloat(porcentaje),
                        valor: parseFloat(valor)
                    })
                });
                btnCancelMiNota.click();
                await openMiRamo(currentMiRamoId, currentMiRamoNombre);
            } catch (e) { alert('Error al guardar la nota en tu base de datos.'); }
            
            btnSaveMiNota.disabled = false;
            btnSaveMiNota.textContent = 'Guardar';
        };

        btnCancelMiNota.onclick = () => {
            overlayMiNota.style.opacity = '0';
            setTimeout(() => overlayMiNota.style.display = 'none', 500);
        };

        function showMsg(msg, color = '#ffcccc') {
            errorMsg.textContent = msg;
            errorMsg.style.color = color;
            errorMsg.style.display = 'block';
            setTimeout(() => errorMsg.style.display = 'none', 6000);
        }

        // --- AUTH ---
        document.getElementById('btn-register').addEventListener('click', () => {
            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;
            if (!email.endsWith('@uc.cl') && !email.endsWith('@estudiante.uc.cl')) {
                showMsg('Solo correos @uc.cl o @estudiante.uc.cl permitidos.');
                return;
            }
            createUserWithEmailAndPassword(auth, email, password)
                .then((cred) => {
                    sendEmailVerification(cred.user).then(() => {
                        showMsg('Cuenta creada. Revisa tu correo UC para verificarla.', '#a8e6cf');
                        signOut(auth);
                    });
                }).catch(err => showMsg(err.message));
        });

        document.getElementById('btn-login').addEventListener('click', () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            signInWithEmailAndPassword(auth, email, password)
                .then((cred) => {
                    if (!cred.user.emailVerified) {
                        showMsg('Debes verificar tu correo UC primero.');
                        signOut(auth);
                    }
                }).catch(err => showMsg('Credenciales incorrectas.'));
        });

        btnLogoutUI.addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user && user.emailVerified) {
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.display = 'none';
                    dashboard.style.display = 'flex';
                    userMenuContainer.style.display = 'block'; 
                    loadCarreras();
                }, 500);
            } else {
                dashboard.style.display = 'none';
                userMenuContainer.style.display = 'none'; 
                overlay.style.display = 'flex';
                setTimeout(() => overlay.style.opacity = '1', 50);
            }
        });
    </script>
</body>
</html>
