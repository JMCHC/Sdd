<html lang="es">
<head>

    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/pw/AP1GczM-QDLV4_StoQYFE9fpmfm2AjaXbodPfWn5iZcmR0C3W_yrnM1P69rQ-UL97rllE-OVF4Zz7ZrhxT6AhbLpVzR1-MURUIj9RTF7UXoXZwv2oNBoV8ULKilizJBb27YYpWLeDTZTQk0sP44b1wyfxFz3KQ=w599-h599-s-no-gm?authuser=0">
    <style>
        /* VARIABLES Y RESET */
        :root {
            --bg-blue: #64849A;
            --folder-red: #C33C3A;
            --text-light: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body {
            background-color: var(--bg-blue);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
        }

        /* PANTALLA DE INICIO DE SESIÓN */
        .auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-blue);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; transition: opacity 0.5s ease;
            overflow-y: auto;
        }
        .auth-modal {
            width: 100%; max-width: 400px; padding: 20px 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: flex; flex-direction: column;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            margin: auto;
        }
        .auth-logo { 
            width: 360px; 
            margin: -60px auto -50px auto;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); 
        }
        .auth-modal h2 { text-align: center; margin-bottom: 2px; font-weight: 500;}
        .auth-modal p { text-align: center; margin-bottom: 15px; font-size: 0.9em; opacity: 0.8; }
        .input-field {
            width: 100%; padding: 12px; margin-bottom: 10px;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px; color: white; outline: none; transition: 0.3s;
        }
        .input-field::placeholder { color: rgba(255,255,255,0.6); }
        .input-field:focus { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.5); }
        .auth-buttons { display: flex; gap: 10px; margin-top: 5px; }
        .btn-primary, .btn-secondary {
            flex: 1; padding: 12px; border-radius: 12px; border: none;
            font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary { background: var(--folder-red); color: white; box-shadow: inset 0 2px 4px rgba(255,255,255,0.2), 0 4px 10px rgba(0,0,0,0.2); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
        .btn-primary:hover, .btn-secondary:hover { transform: translateY(-2px); }

        /* INTERFAZ PRINCIPAL */
        .dashboard {
            width: 100%; max-width: 1200px; padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        
        .main-logo { 
            width: 480px; 
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.15;
            pointer-events: none;
        }
        
        .search-container { width: 100%; max-width: 600px; margin-bottom: 40px; }
        .search-bar {
            width: 100%; padding: 16px 24px; border-radius: 30px;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; font-size: 1.1em; backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1); transition: 0.3s;
        }
        .search-bar::placeholder { color: rgba(255,255,255,0.7); }
        .search-bar:focus { background: rgba(255,255,255,0.15); outline: none; border-color: rgba(255,255,255,0.4); }

        /* CARPETAS ROJAS PREMIUM (MODIFICADO A 4 COLUMNAS) */
        .folders-grid {
            display: grid; 
            grid-template-columns: repeat(4, 1fr);
            gap: 25px; width: 100%;
        }
        @media (max-width: 950px) { .folders-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 750px) { .folders-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 500px) { .folders-grid { grid-template-columns: 1fr; } }
        
        .folder {
            background-color: var(--folder-red);
            border-radius: 16px; padding: 30px 20px;
            cursor: pointer; text-align: center; font-weight: 600; font-size: 1.2em;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2), inset 0 2px 5px rgba(255,255,255,0.3);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.1);
            word-wrap: break-word; 
            display: flex; justify-content: center; align-items: center; position: relative;
        }
        .folder:hover { transform: translateY(-8px); }
        .header-title { margin-bottom: 20px; font-weight: 300; letter-spacing: 1px; width: 100%; }

        /* GRID PARA RAMOS PERSONALES Y TARJETAS */
        .notas-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px; width: 100%;
        }
        @media (max-width: 950px) { .notas-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 650px) { .notas-grid { grid-template-columns: 1fr; } }

        .ramo-card {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px; padding: 20px;
            display: flex; flex-direction: column;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            min-height: 320px;
        }
        .ramo-card h3 { 
            text-align: center; margin-bottom: 15px; font-weight: 600; font-size: 1.3em;
            border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; 
        }
        
        .notas-table-container { flex-grow: 1; overflow-y: auto; max-height: 250px; margin-bottom: 15px; padding-right: 5px; }
        .notas-table-container::-webkit-scrollbar { width: 6px; }
        .notas-table-container::-webkit-scrollbar-track { background: transparent; }
        .notas-table-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        
        .notas-table { width: 100%; border-collapse: collapse; }
        .notas-table th, .notas-table td { padding: 8px 4px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .notas-table th:first-child, .notas-table td:first-child { text-align: left; }
        .notas-table th { font-weight: 600; opacity: 0.8; font-size: 0.9em; position: sticky; top: 0; background: #6b8a9f; z-index: 10; }
        
        .btn-icon { background: transparent; border: none; cursor: pointer; color: white; opacity: 0.6; transition: 0.2s; font-size: 1.1em; padding: 2px 4px; }
        .btn-icon:hover { opacity: 1; transform: scale(1.1); }
        
        /* BOTÓN ELIMINAR DOC Y RAMOS (ADMIN) */
        .btn-delete-doc {
            position: absolute; right: 10px; top: 10px;
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50%; width: 30px; height: 30px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: 0.2s; z-index: 20;
        }
        .btn-delete-doc:hover { background: rgba(231, 76, 60, 0.8); transform: scale(1.1); }

        .promedio-section { margin-top: auto; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.2); text-align: center; }
        .status-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-weight: 600; font-size: 0.9em; margin-top: 8px; }
        .status-aprobado { background: rgba(46, 204, 113, 0.2); color: #4ade80; border: 1px solid rgba(46, 204, 113, 0.4); }
        .status-reprobado { background: rgba(231, 76, 60, 0.2); color: #f87171; border: 1px solid rgba(231, 76, 60, 0.4); }
        .status-neutro { background: rgba(255, 255, 255, 0.1); color: #ccc; border: 1px solid rgba(255, 255, 255, 0.2); }
        
        .card-actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn-small { flex: 1; padding: 10px 5px; border-radius: 10px; font-size: 0.85em; cursor: pointer; border: none; font-weight: 600; transition: 0.2s; }
        .btn-add-nota { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
        .btn-add-nota:hover { background: rgba(255,255,255,0.2); }
        .btn-add-exam { background: rgba(255, 215, 0, 0.1); color: #FFD700; border: 1px dashed #FFD700; }
        .btn-add-exam:hover { background: rgba(255, 215, 0, 0.2); }

        /* LISTA PANEL ADMIN */
        .admin-list-item {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            padding: 15px; border-radius: 12px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
            transition: 0.2s; backdrop-filter: blur(10px);
        }
        .admin-list-item:hover { background: rgba(255,255,255,0.2); }

        /* MENÚ DE USUARIO (HAMBURGUESA) */
        .user-menu-container {
            position: absolute; top: 20px; right: 20px; z-index: 100;
        }
        .hamburger-btn {
            background: transparent; border: 1px solid rgba(255,255,255,0.3);
            padding: 10px; border-radius: 12px; cursor: pointer;
            display: flex; flex-direction: column; gap: 5px;
            transition: background 0.2s;
        }
        .hamburger-btn:hover { background: rgba(255,255,255,0.1); }
        .hamburger-btn span {
            display: block; width: 22px; height: 2px;
            background-color: white; border-radius: 2px;
        }
        .dropdown-menu {
            position: absolute; top: 100%; right: 0; margin-top: 10px;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: none; flex-direction: column; overflow: hidden;
            min-width: 180px;
        }
        .dropdown-menu.show { display: flex; }
        .dropdown-item {
            background: transparent; border: none; color: white;
            padding: 14px 20px; text-align: left; cursor: pointer;
            font-size: 1em; font-weight: 500; transition: background 0.2s;
        }
        .dropdown-item:hover { background: rgba(255,255,255,0.2); }
        .dropdown-item:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>

    <!-- OVERLAY DE INICIO DE SESIÓN -->

        let currentEditNotaId = null; 
        
        // Control de Administrador
        let isAdminUser = false;

        // --- LÓGICA DEL MENÚ DESPLEGABLE ---
        btnMenu.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle('show');
        });

        document.addEventListener('click', (e) => {
            if (!userMenuContainer.contains(e.target)) {
                dropdownMenu.classList.remove('show');
            }
        });

        function hideAllViews() {

            viewArchivos.style.display = 'none';
            viewMisNotas.style.display = 'none';
            viewAdmin.style.display = 'none';
        }

            dropdownMenu.classList.remove('show');
            hideAllViews();
            searchContainer.style.display = 'block';
            viewCarreras.style.display = 'block';
            searchBar.value = '';
            carrerasGrid.querySelectorAll('.folder').forEach(item => item.style.display = 'flex');

                item.style.display = name.includes(text) ? 'flex' : 'none';
            });

        // --- NIVEL 1: CARRERAS (AHORA DESDE LA BASE DE DATOS) ---
        async function loadCarreras() {
            carrerasGrid.innerHTML = '<p style="text-align:center; width:100%; opacity:0.7; grid-column:1/-1;">Cargando carreras...</p>';
            try {
                const res = await fetch(`${WORKER_URL}/carreras`);
                const carrerasData = await res.json();
                carrerasGrid.innerHTML = '';

                carrerasData.forEach((carrera) => {
                    const div = document.createElement('div');
                    div.className = 'folder';
                    div.textContent = carrera.nombre;
                    div.onclick = () => openCarrera(carrera.nombre);

                    // Si es Admin, inyecta botón de basura en el div de la carrera
                    if (isAdminUser) {
                        const delBtn = document.createElement('div');
                        delBtn.className = 'btn-delete-doc';
                        delBtn.innerHTML = '🗑️️';
                        delBtn.onclick = (e) => {
                            e.stopPropagation();
                            deleteCarreraGlobal(carrera.nombre);
                        };
                        div.appendChild(delBtn);
                    }
                    carrerasGrid.appendChild(div);
                });

                // Botón Agregar Carrera (Solo visible para Admin)
                if (isAdminUser) {
                    const btnAdd = document.createElement('div');
                    btnAdd.className = 'folder';
                    btnAdd.style.backgroundColor = 'rgba(255, 215, 0, 0.05)';
                    btnAdd.style.border = '1px dashed #FFD700';
                    btnAdd.style.color = '#FFD700';
                    btnAdd.style.boxShadow = 'none';
                    btnAdd.textContent = '+ Agregar Carrera';
                    btnAdd.onclick = () => {
                        inputTitle.textContent = 'Nueva Carrera';
                        inputValue.placeholder = 'Nombre de la carrera...';
                        inputValue.value = '';
                        btnInputSave.onclick = saveCarreraGlobal; // Asignamos la función de guardar carrera
                        inputOverlay.style.display = 'flex';
                        setTimeout(() => inputOverlay.style.opacity = '1', 50);
                        inputValue.focus();
                    };
                    carrerasGrid.appendChild(btnAdd);
                }

            } catch(e) { carrerasGrid.innerHTML = '<p style="text-align:center; width:100%; grid-column:1/-1;">Error al conectar con la base de datos.</p>'; }
        }

        async function saveCarreraGlobal() {
            const val = inputValue.value.trim();
            if (!val) return;
            btnInputSave.disabled = true;
            btnInputSave.textContent = 'Guardando...';

            try {
                await fetch(`${WORKER_URL}/carreras`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre: val, requester: auth.currentUser.email })
                });
                btnInputCancel.click();
                await loadCarreras();
            } catch (e) { alert('Error de conexión con Cloudflare D1.'); }
            btnInputSave.disabled = false;
            btnInputSave.textContent = 'Guardar';
        }

        async function deleteCarreraGlobal(carreraNombre) {
            if(!confirm(`⚠️ ADMIN: ¿Borrar definitivamente la carrera "${carreraNombre}" y TODOS sus ramos?`)) return;
            try {
                const res = await fetch(`${WORKER_URL}/carreras?nombre=${encodeURIComponent(carreraNombre)}&requester=${encodeURIComponent(auth.currentUser.email)}`, { method: 'DELETE' });
                if(!res.ok) throw new Error("No tienes permisos o falló el servidor");
                await loadCarreras();
            } catch(e) { alert(e.message); }
        }

        async function openCarrera(nombreCarrera) {
            currentCarrera = nombreCarrera;
            titleCarrera.textContent = nombreCarrera;
            hideAllViews();
            viewRamos.style.display = 'block';

            try {

                const ramosData = await res.json();
                ramosGrid.innerHTML = '';

            btnAdd.style.border = '1px dashed rgba(255,255,255,0.4)';
            btnAdd.style.boxShadow = 'none';
            btnAdd.textContent = '+ Agregar Ramo';
            btnAdd.onclick = () => {
                inputTitle.textContent = 'Nuevo Ramo';
                inputValue.placeholder = 'Nombre del ramo...';
                inputValue.value = '';
                btnInputSave.onclick = saveRamoGlobal; // Asignamos la función de guardar ramo
                inputOverlay.style.display = 'flex';
                setTimeout(() => inputOverlay.style.opacity = '1', 50);
                inputValue.focus();
            };
            ramosGrid.appendChild(btnAdd);

        btnBackCarreras.onclick = () => {
            hideAllViews();
            viewCarreras.style.display = 'block';
            currentCarrera = null;
            searchBar.value = '';
            carrerasGrid.querySelectorAll('.folder').forEach(item => item.style.display = 'flex');
        };

        async function saveRamoGlobal() {
            const val = inputValue.value.trim();
            if (!val) return;
            btnInputSave.disabled = true;
            btnInputSave.textContent = 'Guardando...';

            try {
                await fetch(`${WORKER_URL}/ramos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre: val, carrera: currentCarrera, creadoPor: auth.currentUser.email })
                });
                btnInputCancel.click();
                await openCarrera(currentCarrera);
            } catch (e) { alert('Error de conexión con Cloudflare D1.'); }
            btnInputSave.disabled = false;
            btnInputSave.textContent = 'Guardar';
        }

        async function deleteRamoGlobal(ramoId) {
            if(!confirm("⚠️ ADMIN: ¿Borrar definitivamente este ramo y TODOS sus documentos?")) return;
            try {
                const res = await fetch(`${WORKER_URL}/ramos?id=${ramoId}&requester=${encodeURIComponent(auth.currentUser.email)}`, { method: 'DELETE' });
                if(!res.ok) throw new Error("No tienes permisos o falló el servidor");
                await openCarrera(currentCarrera);
            } catch(e) { alert(e.message); }
        }

        btnInputCancel.onclick = () => {
            inputOverlay.style.opacity = '0';
            setTimeout(() => inputOverlay.style.display = 'none', 500);
        };

        // --- NIVEL 3: ARCHIVOS Y ELIMINACIÓN ADMIN ---
        async function openRamo(ramoId, ramoNombre) {
            currentRamoId = ramoId;
            currentRamoNombre = ramoNombre;
            titleRamo.textContent = ramoNombre;
            hideAllViews();
            viewArchivos.style.display = 'block';
            searchBar.value = '';

            archivosGrid.innerHTML = '<p style="text-align:center; width:100%; opacity:0.7; grid-column:1/-1;">Cargando archivos...</p>';
            
            try {
                const res = await fetch(`${WORKER_URL}/archivos?ramoId=${ramoId}`);
                const archivosData = await res.json();
                archivosGrid.innerHTML = '';

                archivosData.forEach((archivo) => {
                    const div = document.createElement('div');
                    div.className = 'folder';
                    div.innerHTML = `📄 ${archivo.nombre}`;
                    
                    div.onclick = () => {
                        const win = window.open();
                        win.document.write(`<iframe src="${archivo.url}" frameborder="0" style="border:0; top:0px; left:0px; bottom:0px; right:0px; width:100%; height:100%;" allowfullscreen></iframe>`);
                    };

                    if (isAdminUser) {
                        const delBtn = document.createElement('div');
                        delBtn.className = 'btn-delete-doc';
                        delBtn.innerHTML = '🗑️';
                        delBtn.onclick = (e) => {
                            e.stopPropagation(); 
                            deleteArchivoGlobal(archivo.id);
                        };
                        div.appendChild(delBtn);
                    }
                    
                    archivosGrid.appendChild(div);
                });
            } catch(e) { archivosGrid.innerHTML = '<p style="text-align:center; width:100%; grid-column:1/-1;">Error al conectar con la base de datos.</p>'; }

            const btnUpload = document.createElement('div');
            btnUpload.className = 'folder';
            btnUpload.style.backgroundColor = 'rgba(255,255,255,0.05)';
            btnUpload.style.border = '1px dashed rgba(255,255,255,0.4)';
            btnUpload.style.boxShadow = 'none';
            btnUpload.textContent = '+ Subir PDF';
            btnUpload.onclick = () => fileUpload.click();
            archivosGrid.appendChild(btnUpload);
        }

        btnBackRamos.onclick = () => openCarrera(currentCarrera);

        fileUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.type !== 'application/pdf') {
                alert('Solo se admiten archivos PDF.');
                fileUpload.value = '';
                return;
            }
            uploadStatus.style.display = 'block';
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const base64String = reader.result;
                try {
                    const response = await fetch(`${WORKER_URL}/archivos`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ nombre: file.name, ramoId: currentRamoId, base64: base64String, subidoPor: auth.currentUser.email })
                    });
                    if (!response.ok) throw new Error('Fallo la carga. Intenta comprimir el PDF.');
                    await openRamo(currentRamoId, currentRamoNombre);
                } catch (error) { alert('Error: ' + error.message); }
                uploadStatus.style.display = 'none';
                fileUpload.value = ''; 
            };
        });

        async function deleteArchivoGlobal(archivoId) {
            if(!confirm("⚠️ ADMIN: ¿Borrar definitivamente este documento para todos?")) return;
            try {
                const res = await fetch(`${WORKER_URL}/archivos?id=${archivoId}&requester=${encodeURIComponent(auth.currentUser.email)}`, { method: 'DELETE' });
                if(!res.ok) throw new Error("No tienes permisos o falló el servidor");
                await openRamo(currentRamoId, currentRamoNombre);
            } catch(e) { alert(e.message); }
        }

        // -----------------------------------------
        // --- SECCIÓN MIS NOTAS / VISTA TARJETAS---
        // -----------------------------------------

        async function loadMisRamos() {
            misRamosGrid.className = 'notas-grid';
            misRamosGrid.innerHTML = '<p style="text-align:center; width:100%; opacity:0.7; grid-column: 1 / -1;">Cargando tus ramos y notas...</p>';
            
            try {
                const resRamos = await fetch(`${WORKER_URL}/mis-ramos?email=${encodeURIComponent(auth.currentUser.email)}`);
                const ramosData = await resRamos.json();
                
                const notesPromises = ramosData.map(ramo => 
                    fetch(`${WORKER_URL}/mis-notas?ramoId=${ramo.id}&email=${encodeURIComponent(auth.currentUser.email)}`).then(r => r.json())
                );
                const allNotesData = await Promise.all(notesPromises);

                misRamosGrid.innerHTML = '';

                ramosData.forEach((ramo, index) => {
                    const notasData = allNotesData[index];
                    let sumaPonderada = 0;
                    let porcentajeTotal = 0;
                    let examenNota = null;
                    let notasNormales = [];

                    notasData.forEach((nota) => {
                        if (nota.nombre.startsWith('[EXAMEN]')) {
                            examenNota = nota;
                        } else {
                            notasNormales.push(nota);
                        }
                    });

                    let tableRows = '';
                    notasNormales.forEach((nota) => {
                        const porc = parseFloat(nota.porcentaje) || 0;
                        const val = parseFloat(nota.valor) || 0;
                        sumaPonderada += (val * (porc / 100));
                        porcentajeTotal += porc;
                        
                        tableRows += `
                        <tr>
                            <td>${nota.nombre}</td>
                            <td>${nota.porcentaje}%</td>
                            <td style="color:#a8e6cf; font-weight:bold;">${nota.valor}</td>
                            <td style="min-width: 55px;">
                                <button class="btn-icon" onclick="window.openEditNotaModal(${nota.id}, ${ramo.id}, '${nota.nombre.replace(/'/g, "\\'")}', ${nota.porcentaje}, ${nota.valor}, false)" title="Editar">✏️</button>
                                <button class="btn-icon" onclick="window.deleteNota(${nota.id})" title="Eliminar">🗑️</button>
                            </td>
                        </tr>`;
                    });

                    let promedioBase = 0;
                    if (porcentajeTotal > 0) {
                        promedioBase = sumaPonderada / (porcentajeTotal / 100);
                    }

                    let notaFinal = promedioBase;
                    
                    if (examenNota) {
                        const pesoExamen = parseFloat(examenNota.porcentaje) || 0;
                        const pesoRestante = 100 - pesoExamen;
                        const valorExamen = parseFloat(examenNota.valor) || 0;
                        notaFinal = (promedioBase * (pesoRestante / 100)) + (valorExamen * (pesoExamen / 100));

                        tableRows += `
                        <tr style="background: rgba(255,215,0,0.1);">
                            <td style="color:#FFD700;">⭐ ${examenNota.nombre.replace('[EXAMEN] ', '')}</td>
                            <td style="color:#FFD700;">${examenNota.porcentaje}%</td>
                            <td style="color:#FFD700; font-weight:bold;">${examenNota.valor}</td>
                            <td style="min-width: 55px;">
                                <button class="btn-icon" onclick="window.openEditNotaModal(${examenNota.id}, ${ramo.id}, '${examenNota.nombre.replace(/'/g, "\\'")}', ${examenNota.porcentaje}, ${examenNota.valor}, true)" title="Editar">✏️</button>
                                <button class="btn-icon" onclick="window.deleteNota(${examenNota.id})" title="Eliminar">🗑️</button>
                            </td>
                        </tr>`;
                    }

                    let isAprobado = notaFinal >= 3.95;
                    let hasEvaluations = notasData.length > 0;
                    let statusHtml = '';

                    if (!hasEvaluations) {
                        statusHtml = `<div class="status-badge status-neutro">Sin evaluaciones</div>`;
                    } else if (isAprobado) {
                        statusHtml = `<div class="status-badge status-aprobado">Ramo aprobado</div>`;
                    } else {
                        statusHtml = `<div class="status-badge status-reprobado">Ramo reprobado</div>`;
                    }

                    let avgDisplay = hasEvaluations ? notaFinal.toFixed(2) : '--';

                    const card = document.createElement('div');
                    card.className = 'ramo-card';
                    card.innerHTML = `
                        <h3>${ramo.nombre}</h3>
                        <div class="notas-table-container">
                            <table class="notas-table">
                                <thead>
                                    <tr><th>Evaluación</th><th>%</th><th>Nota</th><th></th></tr>
                                </thead>
                                <tbody>
                                    ${tableRows || '<tr><td colspan="4" style="text-align:center; opacity:0.5; padding: 20px 0;">Aún no hay notas</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                        <div class="promedio-section">
                            <div style="font-size:1.1em;">Promedio: <span style="font-weight:bold; color: #a8e6cf;">${avgDisplay}</span></div>
                            ${statusHtml}
                        </div>
                        <div class="card-actions"></div>
                    `;

                    const actionsDiv = card.querySelector('.card-actions');
                    
                    const btnNota = document.createElement('button');
                    btnNota.className = 'btn-small btn-add-nota';
                    btnNota.textContent = '+ Evaluación';
                    btnNota.onclick = () => {
                        currentEditNotaId = null; 
                        openAddNotaModal(ramo.id, false);
                    };
                    actionsDiv.appendChild(btnNota);

                    if (!examenNota) {
                        const btnExam = document.createElement('button');
                        btnExam.className = 'btn-small btn-add-exam';
                        btnExam.textContent = '⭐ Examen';
                        btnExam.onclick = () => {
                            currentEditNotaId = null; 
                            openAddNotaModal(ramo.id, true);
                        };
                        actionsDiv.appendChild(btnExam);
                    }

                    misRamosGrid.appendChild(card);
                });

                const addCard = document.createElement('div');
                addCard.className = 'ramo-card';
                addCard.style.justifyContent = 'center';
                addCard.style.alignItems = 'center';
                addCard.style.border = '1px dashed rgba(255,255,255,0.4)';
                addCard.style.cursor = 'pointer';
                addCard.style.background = 'rgba(255,255,255,0.02)';
                addCard.innerHTML = `<div style="font-size:1.2em; font-weight:600; opacity:0.8;">+ Crear Ramo Personal</div>`;
                addCard.onclick = () => {
                    inputMiRamo.value = '';
                    overlayMiRamo.style.display = 'flex';
                    setTimeout(() => overlayMiRamo.style.opacity = '1', 50);
                    inputMiRamo.focus();
                };
                misRamosGrid.appendChild(addCard);

            } catch(e) { 
                misRamosGrid.innerHTML = '<p style="text-align:center; width:100%; grid-column: 1 / -1;">No se pudo conectar a tu base de datos.</p>'; 
            }
        }

        btnSaveMiRamo.onclick = async () => {
            const val = inputMiRamo.value.trim();
            if (!val) return;
            btnSaveMiRamo.disabled = true;
            btnSaveMiRamo.textContent = 'Guardando...';

            try {
                await fetch(`${WORKER_URL}/mis-ramos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre: val, email: auth.currentUser.email })
                });
                btnCancelMiRamo.click();
                await loadMisRamos(); 
            } catch (e) { alert('Error al guardar en tu base de datos.'); }
            
            btnSaveMiRamo.disabled = false;
            btnSaveMiRamo.textContent = 'Guardar';
        };

        btnCancelMiRamo.onclick = () => {
            overlayMiRamo.style.opacity = '0';
            setTimeout(() => overlayMiRamo.style.display = 'none', 500);
        };

        window.openEditNotaModal = (notaId, ramoId, nombre, porcentaje, valor, isExam) => {
            currentEditNotaId = notaId;
            currentMiRamoId = ramoId;
            isAddingExam = isExam;
            
            modalNotaTitle.textContent = isExam ? 'Editar Examen' : 'Editar Evaluación';
            inputNotaNombre.value = isExam ? nombre.replace('[EXAMEN] ', '') : nombre;
            inputNotaPorcentaje.value = porcentaje;
            inputNotaValor.value = valor;
            
            overlayMiNota.style.display = 'flex';
            setTimeout(() => overlayMiNota.style.opacity = '1', 50);
            inputNotaPorcentaje.focus();
        };

        window.deleteNota = async (notaId) => {
            if(!confirm("¿Estás seguro de que deseas eliminar esta evaluación?")) return;
            try {
                const res = await fetch(`${WORKER_URL}/mis-notas?id=${notaId}&email=${encodeURIComponent(auth.currentUser.email)}`, { method: 'DELETE' });
                if(!res.ok) throw new Error('El servidor rechazó la eliminación.');
                await loadMisRamos(); 
            } catch(e) { alert('Error al intentar eliminar: ' + e.message); }
        };

        function openAddNotaModal(ramoId, isExam) {
            currentMiRamoId = ramoId;
            isAddingExam = isExam;
            
            if(isExam) {
                modalNotaTitle.textContent = 'Agregar Examen Final';
                inputNotaNombre.value = 'Examen Final';
            } else {
                modalNotaTitle.textContent = 'Agregar Evaluación';
                inputNotaNombre.value = '';
            }
            inputNotaPorcentaje.value = '';
            inputNotaValor.value = '';
            
            overlayMiNota.style.display = 'flex';
            setTimeout(() => overlayMiNota.style.opacity = '1', 50);
            
            if(isExam) { inputNotaPorcentaje.focus(); } else { inputNotaNombre.focus(); }
        }

        btnSaveMiNota.onclick = async () => {
            let nombre = inputNotaNombre.value.trim();
            const porcentaje = inputNotaPorcentaje.value.trim();
            const valor = inputNotaValor.value.trim();
            
            if (!nombre || !porcentaje || !valor) {
                alert("Por favor completa todos los campos.");
                return;
            }

            if (isAddingExam && !nombre.startsWith('[EXAMEN]')) {
                nombre = '[EXAMEN] ' + nombre;
            }

            btnSaveMiNota.disabled = true;
            btnSaveMiNota.textContent = 'Guardando...';

            const metodoHTTP = currentEditNotaId ? 'PUT' : 'POST';
            const payload = {
                ramoId: currentMiRamoId, email: auth.currentUser.email,
                nombre: nombre, porcentaje: parseFloat(porcentaje), valor: parseFloat(valor)
            };
            if (currentEditNotaId) { payload.id = currentEditNotaId; }

            try {
                const response = await fetch(`${WORKER_URL}/mis-notas`, {
                    method: metodoHTTP,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) throw new Error('Falló al guardar en Cloudflare');
                btnCancelMiNota.click();
                await loadMisRamos(); 
            } catch (e) { alert('Fallo la conexión: ' + e.message); }
            
            btnSaveMiNota.disabled = false;
            btnSaveMiNota.textContent = 'Guardar';
        };

        btnCancelMiNota.onclick = () => {
            overlayMiNota.style.opacity = '0';
            setTimeout(() => overlayMiNota.style.display = 'none', 500);
        };

        // -----------------------------------------
        // --- SECCIÓN PANEL DE ADMINISTRADOR ---
        // -----------------------------------------
        const btnTabUsuarios = document.getElementById('btn-tab-usuarios');
        const btnTabEquipo = document.getElementById('btn-tab-equipo');
        const adminUsuariosContainer = document.getElementById('admin-usuarios-container');
        const adminEquipoContainer = document.getElementById('admin-equipo-container');
        const adminUsersList = document.getElementById('admin-users-list');
        const adminTeamList = document.getElementById('admin-team-list');
        const adminSearchUsers = document.getElementById('admin-search-users');

        btnTabUsuarios.onclick = () => {
            btnTabUsuarios.style.background = '#FFD700'; btnTabUsuarios.style.color = '#000';
            btnTabEquipo.style.background = 'rgba(255,255,255,0.1)'; btnTabEquipo.style.color = '#fff';
            adminUsuariosContainer.style.display = 'block';
            adminEquipoContainer.style.display = 'none';
            loadAdminUsers();
        };

        btnTabEquipo.onclick = () => {
            btnTabEquipo.style.background = '#FFD700'; btnTabEquipo.style.color = '#000';
            btnTabUsuarios.style.background = 'rgba(255,255,255,0.1)'; btnTabUsuarios.style.color = '#fff';
            adminEquipoContainer.style.display = 'block';
            adminUsuariosContainer.style.display = 'none';
            loadAdminTeam();
        };

        async function loadAdminUsers() {
            adminUsersList.innerHTML = '<p style="text-align:center; opacity:0.7;">Cargando usuarios...</p>';
            try {
                const res = await fetch(`${WORKER_URL}/admin/users?requester=${encodeURIComponent(auth.currentUser.email)}`);
                if(!res.ok) throw new Error();
                const users = await res.json();
                
                adminUsersList.innerHTML = '';
                users.forEach(u => {
                    const div = document.createElement('div');
                    div.className = 'admin-list-item user-row';
                    div.innerHTML = `
                        <div style="font-weight: 500;">👤 ${u.email}</div>
                        <div style="opacity: 0.6; font-size: 0.85em;">Último acceso: ${new Date(u.ultimoAcceso).toLocaleDateString()}</div>
                    `;
                    div.onclick = () => loadUserContributions(u.email, div);
                    adminUsersList.appendChild(div);
                });
            } catch(e) { adminUsersList.innerHTML = '<p style="text-align:center; color:#ffcccc;">Error al cargar usuarios.</p>'; }
        }

        adminSearchUsers.addEventListener('input', (e) => {
            const text = e.target.value.toLowerCase();
            document.querySelectorAll('.user-row').forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(text) ? 'flex' : 'none';
            });
        });

        async function loadUserContributions(targetEmail, parentDiv) {
            const existingDetails = parentDiv.querySelector('.contrib-details');
            if(existingDetails) { existingDetails.remove(); return; }

            const detailsDiv = document.createElement('div');
            detailsDiv.className = 'contrib-details';
            detailsDiv.style.width = '100%';
            detailsDiv.style.marginTop = '15px';
            detailsDiv.style.paddingTop = '15px';
            detailsDiv.style.borderTop = '1px solid rgba(255,255,255,0.1)';
            detailsDiv.innerHTML = '<p style="font-size:0.9em; opacity:0.7;">Cargando aportes...</p>';
            
            parentDiv.style.flexWrap = 'wrap';
            parentDiv.appendChild(detailsDiv);

            try {
                const res = await fetch(`${WORKER_URL}/admin/contributions?requester=${encodeURIComponent(auth.currentUser.email)}&email=${encodeURIComponent(targetEmail)}`);
                const data = await res.json();
                
                let html = '<div style="font-size:0.9em;">';
                html += `<strong style="color:#FFD700;">Ramos creados (${data.ramos.length}):</strong><ul style="margin-left: 20px; opacity:0.8;">`;
                data.ramos.forEach(r => html += `<li>${r.nombre} (en ${r.carrera})</li>`);
                html += '</ul>';

                html += `<strong style="color:#FFD700; margin-top:10px; display:block;">Archivos subidos (${data.archivos.length}):</strong><ul style="margin-left: 20px; opacity:0.8;">`;
                data.archivos.forEach(a => html += `<li>📄 ${a.nombre}</li>`);
                html += '</ul></div>';
                
                detailsDiv.innerHTML = html;
            } catch(e) { detailsDiv.innerHTML = '<span style="color:#ffcccc;">Error de red</span>'; }
        }

        async function loadAdminTeam() {
            adminTeamList.innerHTML = '<p style="text-align:center; opacity:0.7;">Cargando equipo...</p>';
            try {
                const res = await fetch(`${WORKER_URL}/admin/team?requester=${encodeURIComponent(auth.currentUser.email)}`);
                const admins = await res.json();
                adminTeamList.innerHTML = '';
                admins.forEach(a => {
                    adminTeamList.innerHTML += `
                        <div class="admin-list-item" style="cursor:default;">
                            <div style="font-weight: 500; color: #FFD700;">⭐ ${a.email}</div>
                            <div style="opacity: 0.6; font-size: 0.85em;">Administrador</div>
                        </div>
                    `;
                });
            } catch(e) { adminTeamList.innerHTML = '<p style="text-align:center; color:#ffcccc;">Error al cargar equipo.</p>'; }
        }

        document.getElementById('btn-add-team').onclick = async () => {
            const newAdmin = document.getElementById('admin-new-team-email').value.trim();
            if(!newAdmin) return;
            try {
                const res = await fetch(`${WORKER_URL}/admin/team`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ newAdmin, requester: auth.currentUser.email })
                });
                if(res.ok) {
                    document.getElementById('admin-new-team-email').value = '';
                    loadAdminTeam();
                } else alert("Fallo al invitar (Revisa permisos).");
            } catch(e) { alert("Error de red"); }
        };

        // --- AUTH Y CARGA INICIAL ---
        function showMsg(msg, color = '#ffcccc') {
            errorMsg.textContent = msg;
            errorMsg.style.color = color;
            errorMsg.style.display = 'block';
            setTimeout(() => errorMsg.style.display = 'none', 6000);
        }

        document.getElementById('btn-register').addEventListener('click', () => {
            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;
            if (!email.endsWith('@uc.cl') && !email.endsWith('@estudiante.uc.cl')) {
                showMsg('Solo correos @uc.cl o @estudiante.uc.cl permitidos.');
                return;
            }
            createUserWithEmailAndPassword(auth, email, password)
                .then((cred) => {
                    sendEmailVerification(cred.user).then(() => {
                        showMsg('Cuenta creada. Revisa tu correo UC para verificarla.', '#a8e6cf');
                        signOut(auth);
                    });
                }).catch(err => showMsg(err.message));
        });

        document.getElementById('btn-login').addEventListener('click', () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            signInWithEmailAndPassword(auth, email, password)
                .then((cred) => {
                    if (!cred.user.emailVerified) {
                        showMsg('Debes verificar tu correo UC primero.');
                        signOut(auth);
                    }
                }).catch(err => showMsg('Credenciales incorrectas.'));
        });

        btnLogoutUI.addEventListener('click', () => {
            isAdminUser = false;
            btnAdminPanelUI.style.display = 'none';
            signOut(auth);
        });

        onAuthStateChanged(auth, async (user) => {
            if (user && user.emailVerified) {
                fetch(`${WORKER_URL}/track-user`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: user.email })
                }).catch(()=>{});

                try {
                    const res = await fetch(`${WORKER_URL}/admin/check?email=${encodeURIComponent(user.email)}`);
                    const data = await res.json();
                    isAdminUser = data.isAdmin;
                    if (isAdminUser) btnAdminPanelUI.style.display = 'block';
                } catch(e) { console.error(e); }

                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.display = 'none';
                    dashboard.style.display = 'flex';
                    userMenuContainer.style.display = 'block'; 
                    loadCarreras();
                }, 500);
            } else {
                dashboard.style.display = 'none';
                userMenuContainer.style.display = 'none'; 
                overlay.style.display = 'flex';
                setTimeout(() => overlay.style.opacity = '1', 50);
            }
        });
    </script>
</body>
</html>
